name: Build Signed Release APK (Bazaar & Myket)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'شماره نسخه عددی (نسخه اول: 1 | آپدیت‌های بعدی: 2، 3 و...)'
        required: true
        default: '1'
      version_name:
        description: 'نام نسخه نمایشی به کاربر (مثلاً 1.0 یا 1.1)'
        required: true
        default: '1.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Initialize Android Project
        run: |
          npm install
          npm run build
          npx cap init "Tech News" "ir.technews.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate Custom IT Computer App Icon & Configure Android Back Key
        run: |
          pip install pillow
          python3 - << 'EOF'
          import os, shutil
          from PIL import Image, ImageDraw

          def create_tech_icon(size=512):
              img = Image.new("RGBA", (size, size), (6, 10, 18, 255))
              draw = ImageDraw.Draw(img)

              margin = int(size * 0.04)
              draw.rounded_rectangle([margin, margin, size-margin, size-margin], radius=int(size*0.22), fill=(13, 22, 38, 255), outline=(34, 211, 238, 255), width=int(size*0.025))

              c_color = (30, 58, 138, 255)
              draw.line([(int(size*0.12), int(size*0.25)), (int(size*0.25), int(size*0.25))], fill=c_color, width=6)
              draw.line([(int(size*0.75), int(size*0.25)), (int(size*0.88), int(size*0.25))], fill=c_color, width=6)
              draw.line([(int(size*0.12), int(size*0.75)), (int(size*0.28), int(size*0.75))], fill=c_color, width=6)
              draw.line([(int(size*0.72), int(size*0.75)), (int(size*0.88), int(size*0.75))], fill=c_color, width=6)

              m_left, m_top, m_right, m_bottom = int(size*0.17), int(size*0.20), int(size*0.83), int(size*0.64)
              draw.rounded_rectangle([m_left, m_top, m_right, m_bottom], radius=int(size*0.05), fill=(7, 14, 26, 255), outline=(56, 189, 248, 255), width=int(size*0.028))

              s_pad = int(size*0.035)
              draw.rounded_rectangle([m_left+s_pad, m_top+s_pad, m_right-s_pad, m_bottom-s_pad], radius=int(size*0.025), fill=(12, 34, 64, 255))

              pts = [
                  (int(size*0.25), int(size*0.50)),
                  (int(size*0.38), int(size*0.36)),
                  (int(size*0.48), int(size*0.45)),
                  (int(size*0.63), int(size*0.30)),
                  (int(size*0.75), int(size*0.40))
              ]
              draw.line(pts, fill=(34, 211, 238, 255), width=int(size*0.026), joint="curve")
              for idx, (px, py) in enumerate(pts):
                  r = int(size*0.024)
                  col = (250, 204, 21, 255) if idx in (1, 3) else (34, 211, 238, 255)
                  draw.ellipse([px-r, py-r, px+r, py+r], fill=col)

              draw.polygon([
                  (int(size*0.43), int(size*0.64)),
                  (int(size*0.57), int(size*0.64)),
                  (int(size*0.61), int(size*0.77)),
                  (int(size*0.39), int(size*0.77))
              ], fill=(56, 189, 248, 255))

              draw.rounded_rectangle([int(size*0.28), int(size*0.77), int(size*0.72), int(size*0.82)], radius=int(size*0.02), fill=(34, 211, 238, 255))
              return img

          icon = create_tech_icon(512)
          icon.save("TechNews-Icon-512x512.png")

          res_dir = "android/app/src/main/res"
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, px in sizes.items():
              p = os.path.join(res_dir, folder)
              os.makedirs(p, exist_ok=True)
              resized = icon.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(p, "ic_launcher.png"))
              resized.save(os.path.join(p, "ic_launcher_round.png"))
              resized.save(os.path.join(p, "ic_launcher_foreground.png"))

          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)
          EOF

          cat << 'EOF' > android/app/src/main/java/ir/technews/app/MainActivity.java
          package ir.technews.app;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "(function(){ return window.handleAndroidBack ? window.handleAndroidBack() : 'EXIT'; })()",
                                  result -> {
                                      if (result != null && result.contains("EXIT")) {
                                          finish();
                                      }
                                  }
                              );
                          } else {
                              finish();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Apply Version Code, Permanent Keystore & Sign Release APK
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          VER_CODE="${{ github.event.inputs.version_code }}"
          VER_NAME="${{ github.event.inputs.version_name }}"
          VER_CODE=${VER_CODE:-1}
          VER_NAME=${VER_NAME:-"1.0"}

          sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode $VER_CODE/g" app/build.gradle
          sed -i -E "s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]+\"/versionName \"$VER_NAME\"/g" app/build.gradle

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using permanent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
          else
            echo "Generating new permanent keystore for first release..."
            keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias appkey -storepass 123456 -keypass 123456 \
              -dname "CN=TechNews, OU=Mobile, O=TechApp, L=Mashhad, S=Khorasan, C=IR"
            base64 -w 0 release-key.jks > ../KEYSTORE_BASE64.txt
          fi

          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=123456

      - name: Prepare APK for Upload
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./TechNews-Release.apk

      - name: Upload Signed APK, Store Icon & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: TechNews-Bazaar-Myket-Package
          if-no-files-found: ignore
          path: |
            ./TechNews-Release.apk
            ./TechNews-Icon-512x512.png
            ./android/release-key.jks
            ./KEYSTORE_BASE64.txt
